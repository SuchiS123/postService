spring:
  application:
    name: POST-SERVICE  # Ensure this is set to 'POST-SERVICE'
  datasource:
    url: jdbc:mysql://localhost:3306/postdb
    username: root
    password: Test@2024#

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate.dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8081

eureka:
  instance:
    prefer-ip-address: true  # Use a boolean value here
    appname: POST-SERVICE  # This will register with the name 'POST-SERVICE' in Eureka
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
